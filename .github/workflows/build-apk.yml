name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # elle "Run workflow" ile de çalıştırılabilir

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Buildozer ile APK derle
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: eposta-apk
          path: ${{ steps.buildozer.outputs.filename }}

      - name: Sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: E-Posta Aracı APK (build ${{ github.run_number }})
          files: ${{ steps.buildozer.outputs.filename }}
