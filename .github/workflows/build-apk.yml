name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake \
            libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: APK derle
        run: yes | buildozer android debug

      - name: APK yukle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: eposta-apk
          path: bin/*.apk

      - name: Surum (Release) yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: E-Posta Araci APK build ${{ github.run_number }}
          files: bin/*.apk
