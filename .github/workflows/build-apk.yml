name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Favori Mesaj'in CALISAN sistem paketleri (libtool-bin + libltdl-dev
      # sart: yoksa libffi derlenirken LT_SYS_SYMBOL_USCORE hatasi verir)
      - name: Sistem araclari
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git zip unzip patch \
            autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev libncurses-dev \
            openjdk-17-jdk-headless
          JH=$(ls -d /usr/lib/jvm/java-17-openjdk* | head -1)
          echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          echo "$JH/bin" >> "$GITHUB_PATH"

      # KARARLI buildozer. p4a surumu ARTIK buildozer.spec'teki p4a.branch ile
      # kilitleniyor (v2024.01.21 -> Python 3.11.5). pip ile p4a pinlemek ISE
      # YARAMAZ: buildozer p4a'yi kendisi git'ten kloniyor.
      - name: Buildozer (kararli)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.36" "buildozer==1.5.0" virtualenv
          buildozer --version

      - name: Onbellegi geri yukle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer2-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            buildozer2-${{ runner.os }}-

      # Onbellekten gelmis olabilecek ESKI p4a klonunu (master/3.14) sil ki
      # buildozer p4a.branch = v2024.01.21'i TAZE klonlasin. Agir indirmeler
      # (~/.buildozer, gradle) korunur, sadece p4a checkout'u yenilenir.
      - name: Eski p4a klonu + dist'i temizle
        # p4a klonunu (master/3.14) sil + hazir dist'i sil ki AndroidManifest
        # (targetSdkVersion = android.api) her derlemede YENIDEN uretilsin.
        # Agir derlemeler (CPython/NDK, build/other_builds) onbellekte kalir.
        run: |
          rm -rf .buildozer/android/platform/python-for-android
          rm -rf .buildozer/android/platform/build-*/dists

      - name: APK derle
        run: buildozer -v android debug

      - name: Onbellegi kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer2-${{ runner.os }}-${{ github.run_number }}

      - name: APK yukle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: eposta-apk
          path: bin/*.apk

      - name: Surum (Release) yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: E-Posta Araci APK ${{ github.run_number }}
          files: bin/*.apk
